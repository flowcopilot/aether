[package]
name = "aether"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aether-core = { path = "../aether-core" }
aether-store = { path = "../aether-store" }
a2a = { package = "a2a-lf", version = "0.4.2" }
axum = "0.8.4"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.11.1"
futures-util = { version = "0.3.31", features = ["sink"] }
governor = "0.10.4"
iroh = "1.1.0"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
getrandom = "0.4.3"
hex = { version = "0.4.3", features = ["serde"] }
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
form_urlencoded = "1.2.2"
time = { version = "0.3.55", features = ["formatting"] }
serde_path_to_error = "0.1.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
base64 = "0.23.1"
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
uuid = { version = "1.26.0", features = ["v4"] }
usage-rs = "7.1.4"
rcgen = "0.14.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.2.0", features = ["transport-io"] }
rustls = "0.23.46"
schemars = "1.2.2"
topcoat = { version = "0.10.0", features = ["tower", "ui", "tailwind", "sse"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "1.18.1"
sha2 = "0.11.1"

[dev-dependencies]
assert_cmd = "2.2.2"
cucumber = "0.23.0"
insta = "1.48.0"
predicates = "3.1.4"
rusqlite = "0.40.2"
tempfile = "3.27.0"

# Every product feature lives in `features/node/*.feature` at the repository
# root. Cucumber prints the scenarios itself, so libtest is off.
[[test]]
name = "features"
harness = false

[lints]
workspace = true

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }
