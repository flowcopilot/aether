\* HubInvite: the hub invite and access-request handshake. See HubInvite.tla.
\* GrantToTypedName and KeptLineFromNamedHost are false (trust in the hub);
\* the spec explains each one.
CONSTANTS
    Ids = {i1}
    HostEp = hostEp
    HostName = host
    EvilEp = evilEp
    EvilName = evil
    CallerEp = callerEp
    CallerName = caller
    OtherEp = otherEp
    OtherName = other
    MaxSigns = 2
    MaxApprovals = 2
    MaxCallerApprovals = 1
    StoreFaults = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    GrantFollowsApproval
    OneEndpointPerApproval
    OneGrantPerApproval
    BundleMatchesApproval
    CallerKeepsAccepted
    NeverSignBlocked

PROPERTIES
    InviteDelivered
