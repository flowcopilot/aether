\* Admission: one wire request on the host. See Admission.tla.
\* Two endpoints, and the owner can give the name `alice` to both, so that
\* the shared per-peer limit is in the model. NoTaskIdClash, NoSharedQuota
\* and NoReplayBeforeExpiry are false; the spec explains each one.
CONSTANTS
    Eps = {e1, e2}
    Names = {alice, mallory}
    HonestName = alice
    HonestEp = e1
    TaskIds = {t1, t2}
    Keys = {k1, k2}
    Data = {d1, d2}
    Nonces = {n1, n2}
    ReplayLimit = 1
    Global = 2
    PerPeer = 1
    DirectScope = direct
    OtherScope = other

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OwnerIsAuthenticated
    AdmittedWasCovered
    RowOfInvitedPerson
    OneTaskPerKey
    QueueWithinLimits
    OnlyGoodFramesChange
    NoForeignRead
    OnlyOwnerCancels

PROPERTIES
    RowsAreStable
    HonestGetsIn
