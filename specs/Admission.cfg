\* Admission: one wire request on the host. See Admission.tla.
\* Two endpoints, and the owner can give the name `alice` to both, so that
\* two endpoints with one name are in the model. The node can make one
\* task ID of its own, for one clash of task IDs. There is one data value:
\* a changed request under a known key has another name or task ID.
CONSTANTS
    Eps = {e1, e2}
    Names = {alice, mallory}
    HonestName = alice
    HonestEp = e1
    TaskIds = {t1, t2}
    NodeIds = {m1}
    Keys = {k1, k2}
    Data = {d1}
    Nonces = {n1, n2}
    ReplayLimit = 1
    Global = 2
    PerPeer = 1
    DirectScope = direct
    OtherScope = other

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OwnerIsAuthenticated
    AdmittedWasCovered
    RowOfInvitedPerson
    OneTaskPerKey
    OneTaskPerSentId
    QueueWithinLimits
    OnlyGoodFramesChange
    NoForeignRead
    OnlyOwnerCancels
    NoTaskIdClash
    NoSharedQuota

PROPERTIES
    RowsAreStable
    NoReplayBeforeExpiry
    HonestGetsIn
