\* Two node processes that share one store, one task, three request frames,
\* two claims. SlowAttempts = TRUE: a lease can expire while its attempt
\* still runs, so NoStaleRecord is checked without a timing assumption.
\* OneAttempt is not checked here: it needs SlowAttempts = FALSE (see
\* Outbox.tla).
CONSTANTS
    Procs = {p1, p2}
    Tasks = {t1}
    MaxNonce = 3
    MaxClaims = 2
    SlowAttempts = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HostOneTask
    AnswerIsReal
    NoFalseFailure

PROPERTIES
    NoStaleRecord
    TerminalStable
    EveryTaskEnds
