\* ConnectedAgent: the agent socket. See ConnectedAgent.tla.
\* Two task IDs, so two turns are open on one connection at once. One turn for
\* each task ID and one connection. The replace path and a second turn of a task
\* ID need more room than TLC has in its default memory with two tasks: they
\* are checked by ConnectedAgentRerun (one task ID, two turns, two connections).
CONSTANTS
    Tasks = {t1, t2}
    MaxConns = 1
    MaxTurns = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PendingIsOpenTurn
    NoProtocolError
    AnswerFromHolder
    TurnEndsOnce
    NoLostCancel
    NoStaleCancel
    NoOrphanWait

PROPERTIES
    NoAgentNoTask
    EarlyCancelHonored
    LateCancelDropped
    CancelToldToHolder
    AnswerAfterSent
    TaskOnlyToAttached
    AnswerWhileAttached
    TurnEnds
    LostAgentFailsTurn
    CancelStopsHonestTurn
