\* ConnectedAgent: the agent socket. See ConnectedAgent.tla.
\* One task ID that gets two turns, and two connections (the second
\* replaces the first, or attaches after it closed). Two tasks with one turn
\* each pass the safety properties too, but that run takes 8 minutes.
\* NoStaleCancel, NoLostCancel, TaskOnlyToAttached, AnswerWhileAttached,
\* AnswerAfterSent and NoOrphanWait are false; the spec explains each one.
CONSTANTS
    Tasks = {t1}
    MaxConns = 2
    MaxTurns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PendingIsOpenTurn
    NoProtocolError
    AnswerFromHolder
    TurnEndsOnce
    HonestNoOrphanWait

PROPERTIES
    NoAgentNoTask
    EarlyCancelHonored
    LateCancelDropped
    CancelToldToHolder
    HonestAnswerAfterSent
    TurnEnds
    LostAgentFailsTurn
    CancelStopsHonestTurn
