\* ManagedRoster: the managed roster and the directory records. See
\* ManagedRoster.tla. Two agents, two tokens, two spellings of the control
\* URL, two sync processes, pages of two events. RevokeStays,
\* NoAdmitAfterServiceRevoke, ResolveIsForAgent, RevokedStaysOut,
\* EveryKeyCatchesUp and DirSyncCatchesUp are false; the spec explains
\* each one.
CONSTANTS
    Agents = {a1, a2}
    Eps = {e1, e2}
    Tokens = {t1, t2}
    Keys = {k1, k2}
    Procs = {p1, p2}
    Page = 2
    MaxRec = 2
    MaxDirLog = 3

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TokenOnce
    RosterFromLog
    AdmitIsMember
    OneKeyExact
    OneKeyRevokeStays
    UsedRecordIsTrusted
    HonestResolveIsForAgent
    CacheIsSigned

PROPERTIES
    CursorForward
    DirCursorForward
    RevokeReaches
    DirSyncUnlessPoisoned
