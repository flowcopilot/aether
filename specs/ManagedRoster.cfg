\* ManagedRoster: the managed roster and the directory records. See
\* ManagedRoster.tla. Two agents, two tokens, two spellings of the control
\* URL, two sync processes, pages of two events.
\* NoAdmitAfterServiceRevoke is false by design; the spec explains it.
\* Three directory events keep the run short. The case where the owner
\* publishes an older record over a newer one and a revoke follows needs
\* four: RevokedStaysOut also holds with MaxDirLog = 4 (run it without the
\* PROPERTIES, which takes about 20 s).
CONSTANTS
    Agents = {a1, a2}
    Eps = {e1, e2}
    Tokens = {t1, t2}
    Keys = {k1, k2}
    Procs = {p1, p2}
    Page = 2
    MaxRec = 2
    MaxDirLog = 3

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TokenOnce
    RosterFromLog
    AdmitIsMember
    OneKeyExact
    RevokeStays
    UsedRecordIsTrusted
    ResolveIsForAgent
    RevokedStaysOut
    CacheIsSigned

PROPERTIES
    CursorForward
    DirCursorForward
    RevokeReaches
    EveryKeyCatchesUp
    DirSyncCatchesUp
