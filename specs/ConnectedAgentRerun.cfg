\* ConnectedAgentRerun: ConnectedAgent with the same task ID turns twice. See ConnectedAgent.tla.
\* One task ID that gets two turns, and two connections (the second
\* replaces the first, or attaches after it closed).
CONSTANTS
    Tasks = {t1}
    MaxConns = 2
    MaxTurns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    PendingIsOpenTurn
    NoProtocolError
    AnswerFromHolder
    TurnEndsOnce
    NoLostCancel
    NoStaleCancel
    NoOrphanWait

PROPERTIES
    NoAgentNoTask
    EarlyCancelHonored
    LateCancelDropped
    CancelToldToHolder
    AnswerAfterSent
    TaskOnlyToAttached
    AnswerWhileAttached
    TurnEnds
    LostAgentFailsTurn
    CancelStopsHonestTurn
