\* EventPaging: the event journal, one poll page, and the polling loops.
\* A page has at most two events and a byte budget of 3; a progress event
\* has size 1 or 2, so two events do not always fit. See EventPaging.tla.
\* PageProgress needs Sizes within 1..Budget.
CONSTANTS
    MaxEvents = 6
    PageLimit = 2
    Budget = 3
    Sizes = {1, 2}
    MaxLost = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Dense
    PageIsRun
    MoreIsHonest
    SnapshotAtOneInstant
    PageProgress
    CursorInJournal
    CliInOrder
    CliComplete
    OutboxReadsToEnd

PROPERTIES
    JournalNeverChanges
    CursorNeverBack
    EndedTaskStops
