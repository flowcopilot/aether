\* Two calls of sign_direct_invite, one caller, one attacker endpoint, two
\* contact names.
CONSTANTS
    Invites = {i1, i2}
    CallerName = caller
    CallerEp = callerEp
    EvilName = evil
    EvilEp = evilEp
    HostName = host
    OtherName = other
    HostEp = hostEp
    Faults = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoOrphanGrant
    AdmitOnlyInvited
    KeptAuthIsOwn
    OneNamePerEndpoint
    NoStrayMember
    ReturnedLineWorks

PROPERTIES
    NameKeepsEndpoint
    InviteEnds
