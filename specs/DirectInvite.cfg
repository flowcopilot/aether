\* Two calls of sign_direct_invite that can interleave, one caller, one
\* attacker endpoint, two contact names. ReturnedLineWorks and NoStrayMember
\* are false (see DirectInvite.tla) and are not checked here.
CONSTANTS
    Invites = {i1, i2}
    CallerName = caller
    CallerEp = callerEp
    EvilName = evil
    EvilEp = evilEp
    HostName = host
    OtherName = other
    HostEp = hostEp
    Faults = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoOrphanGrant
    AdmitOnlyInvited
    KeptAuthIsOwn
    OneNamePerEndpoint

PROPERTIES
    NameKeepsEndpoint
    InviteEnds
