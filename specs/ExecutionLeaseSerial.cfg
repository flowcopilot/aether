\* ExecutionLeaseSerial: ExecutionLease with the default limit of one running
\* task. See ExecutionLeaseSerial.tla.
SPECIFICATION FairSpec
CONSTANTS
    Tasks = {t1, t2}
    MaxExec = 3
    TTL = 2
    MaxTime = 5
    MaxRestarts = 1
    MaxCap = 1
INVARIANTS
    TypeOK
    LeaseIffActive
    AtMostOneStart
    TurnMatchesState
    NoSpuriousCancel
    OneStartAtATime
    OneExecution
PROPERTIES
    CancelReachesTurn
    RunningWithinCap
    CapChangeTouchesNothing
