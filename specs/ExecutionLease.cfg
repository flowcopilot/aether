\* ExecutionLease: up to two executions at once (MaxCap), two tasks, a clock of
\* four ticks. A node restart is not in this run (MaxRestarts = 0): it needs a
\* larger state space than TLC finishes in minutes; ExecutionLeaseSerial checks
\* restarts with one execution at a time, and a restart only resets every worker.
SPECIFICATION FairSpec
CONSTANTS
    Tasks = {t1, t2}
    MaxExec = 3
    TTL = 2
    MaxTime = 4
    MaxRestarts = 0
    MaxCap = 2
INVARIANTS
    TypeOK
    LeaseIffActive
    AtMostOneStart
    TurnMatchesState
    NoSpuriousCancel
    OneStartAtATime
PROPERTIES
    CancelReachesTurn
    RunningWithinCap
    CapChangeTouchesNothing
