\* PendingChange: local administration. See PendingChange.tla.
\* One change id, which is also the id of a grant in the policy file. Three
\* requests, one process stop, and store writes that can fail.
\* StaleSeesRevoke and NoMcpRevival are false by design; the spec explains
\* each one.
CONSTANTS
    Ids = {i1}
    FileIds = {i1}
    MaxOps = 3
    MaxRestarts = 1
    StoreFaults = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HighRiskGrantNeedsUi
    CapabilityNeedsUi
    StoredFromUi
    LiveFromUi
    LiveMatchesStore
    RevokedStaysOut
    StaleRefused
    Audited
    ExpiredNeverApplies

PROPERTIES
    RequestEnds
