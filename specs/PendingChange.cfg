\* PendingChange: local administration. See PendingChange.tla.
\* One change id, which is also the id of a grant in the policy file. Three
\* requests, one process stop, and store writes that can fail.
\* LiveFromUi, StaleRefused, StaleSeesRevoke, NoMcpRevival,
\* LiveMatchesStoreAlways and Audited are false; the spec explains each one.
CONSTANTS
    Ids = {i1}
    FileIds = {i1}
    MaxOps = 3
    MaxRestarts = 1
    StoreFaults = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HighRiskGrantNeedsUi
    CapabilityNeedsUi
    ChangeNeedsUi
    LiveFromUiOrPolicy
    LiveMatchesStore
    RevokedStaysOut
    StaleRefusedWhileRecorded
    AuditedWhileRecorded

PROPERTIES
    ExpiredRowStays
    RequestEnds
