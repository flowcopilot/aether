name: Release binaries

on:
  pull_request:
    paths:
      - "Cargo.*"
      - "crates/**"
      - "scripts/release.py"
      - ".github/workflows/release.yml"
      - "cog.toml"
  # A manual run on main makes a release: Cocogitto picks the version from
  # the Conventional Commits since the last tag, unless one is given.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.3.0. Leave empty to calculate it from the commits."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check Conventional Commits
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: check

  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The bump hooks push the version commit and tag.
          persist-credentials: true
      - name: Choose the version
        id: args
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "args=--auto" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "args=--version $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "The version must have the form MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Bump the version, write CHANGELOG.md, and push the tag
        id: bump
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: bump
          args: ${{ steps.args.outputs.args }}
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

  build:
    needs: version
    # Pull requests skip `version` and build the pull request head.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Check tag version
        shell: bash
        run: |
          version=$(python3 scripts/release.py version)
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "The tag must match workspace.package.version: v$version" >&2
            exit 1
          fi
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add "$TARGET"
      - name: Install Debian packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build and check the binary
        shell: bash
        run: |
          cargo build --release --locked -p aether --target "$TARGET"
          "target/$TARGET/release/aether" --help
      - name: Check Cargo installation
        shell: bash
        run: |
          cargo install --path crates/aether --locked --target "$TARGET" --root "$RUNNER_TEMP/cargo-install"
          "$RUNNER_TEMP/cargo-install/bin/aether" --help
      - name: Package
        shell: bash
        run: python3 scripts/release.py package --target "$TARGET" --binary "target/$TARGET/release/aether"
      - name: Check archive installation
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/archive"
          tar -xzf target/dist/*.tar.gz -C "$RUNNER_TEMP/archive"
          "$RUNNER_TEMP/archive/aether" --help
      - name: Check Debian installation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/dist/*.deb
          /usr/bin/aether --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

  assemble:
    needs: [version, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aether-*
          path: target/dist
          merge-multiple: true
      - name: Create formula and checksums
        run: |
          python3 scripts/release.py finalize
          cd target/dist
          sha256sum --check SHA256SUMS
          ruby -c aether.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: target/dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --generate-notes

  homebrew:
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    needs: [version, publish]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update Homebrew tap
        run: |
          mkdir -p tap/Formula
          cp dist/aether.rb tap/Formula/aether.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/aether.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(homebrew): release aether $TAG"
            git push
          fi
