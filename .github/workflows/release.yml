name: Release binaries

on:
  pull_request:
    paths:
      - "Cargo.*"
      - "crates/**"
      - "scripts/release.py"
      - ".github/workflows/release.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag version
        shell: bash
        run: |
          version=$(python3 scripts/release.py version)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match workspace.package.version: v$version" >&2
            exit 1
          fi
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add "$TARGET"
      - name: Install Debian packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build and check the binary
        shell: bash
        run: |
          cargo build --release --locked -p aether --target "$TARGET"
          "target/$TARGET/release/aether" --help
      - name: Check Cargo installation
        shell: bash
        run: |
          cargo install --path crates/aether --locked --target "$TARGET" --root "$RUNNER_TEMP/cargo-install"
          "$RUNNER_TEMP/cargo-install/bin/aether" --help
      - name: Package
        shell: bash
        run: python3 scripts/release.py package --target "$TARGET" --binary "target/$TARGET/release/aether"
      - name: Check archive installation
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/archive"
          tar -xzf target/dist/*.tar.gz -C "$RUNNER_TEMP/archive"
          "$RUNNER_TEMP/archive/aether" --help
      - name: Check Debian installation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/dist/*.deb
          /usr/bin/aether --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aether-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aether-*
          path: target/dist
          merge-multiple: true
      - name: Create formula and checksums
        run: |
          python3 scripts/release.py finalize
          cd target/dist
          sha256sum --check SHA256SUMS
          ruby -c aether.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: target/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  homebrew:
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Homebrew tap
        run: |
          mkdir -p tap/Formula
          cp dist/aether.rb tap/Formula/aether.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/aether.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(homebrew): release aether $GITHUB_REF_NAME"
            git push
          fi
