[book]
title = "Aether"
description = "Share your personal AI agent with people you trust."
authors = ["Aether contributors"]
language = "en"
src = "."

[build]
build-dir = "../target/docs-site"
create-missing = false

[output.html]
site-url = "/aether/"
git-repository-url = "https://github.com/flowcopilot/aether"
edit-url-template = "https://github.com/flowcopilot/aether/edit/main/docs/{path}"
additional-css = ["assets/aether.css"]
default-theme = "light"
preferred-dark-theme = "coal"
no-section-label = true
